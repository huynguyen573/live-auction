# --- Local dev defaults: H2 in-memory DB, zero setup required ---
spring.datasource.url=jdbc:h2:mem:auctiondb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Swap to this block when you deploy with real Postgres ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/auctiondb
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.hibernate.ddl-auto=validate

server.port=8080

# JWT
jwt.secret=change-this-to-a-long-random-string-before-deploying-anywhere-real
jwt.expiration-ms=86400000

# CORS - frontend dev server
app.cors.allowed-origins=http://localhost:5173
